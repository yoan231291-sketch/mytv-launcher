name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }

      - name: Build
        run: gradle -p android assembleRelease --no-daemon

      - name: Publicar en Releases (tag "latest")
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk mytv-launcher.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest mytv-launcher.apk --title "MyTV Launcher (build ${{ github.run_number }})" \
            --notes "APK para Fire TV / Android TV. Instálalo con scripts/firetv-setup.sh"
