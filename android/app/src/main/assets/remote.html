<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyTV">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>MyTV Remote</title>
<style>
  /* Control estilo Apple TV: panel táctil arriba, botones redondos, apps y ciudades abajo */
  :root { --bg:#000; --fg:#f5f5f7; --muted:#8e8e93; --key:#1c1c1e; --key-on:#3a3a3c; --pad:#161618; --accent:#0a84ff; color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); max-width:480px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  header h1 { font-size:17px; font-weight:600; margin:0; }
  header { gap:12px; } header h1 { flex:1; }
  #power { width:44px; height:44px; border-radius:50%; border:0; background:#3a3a3c; color:#fff; display:grid; place-items:center; flex:none; }
  #power svg { width:20px; height:20px; }
  #power.on { background:#30d158; color:#002b0e; }
  #power.busy { opacity:.5; }
  #status { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  #status i { width:8px; height:8px; border-radius:50%; background:#30d158; }
  #status.off i { background:#ff453a; }

  #pad { position:relative; height:min(52vh, 340px); border-radius:28px; background:var(--pad); border:1px solid #2c2c2e; touch-action:none; overflow:hidden; }
  #pad .hint { position:absolute; inset:auto 0 14px 0; text-align:center; font-size:12px; color:#48484a; pointer-events:none; }
  #pad .dot { position:absolute; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:rgba(255,255,255,.08); opacity:0; transition:opacity .25s; pointer-events:none; }
  #pad .arrow { position:absolute; color:#3a3a3c; font-size:22px; pointer-events:none; }
  #pad .a-up { top:12px; left:50%; transform:translateX(-50%); } #pad .a-down { bottom:34px; left:50%; transform:translateX(-50%); }
  #pad .a-left { left:14px; top:50%; transform:translateY(-50%); } #pad .a-right { right:14px; top:50%; transform:translateY(-50%); }
  #pad.flash { background:#1f1f22; }

  .row { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-top:18px; }
  .key { aspect-ratio:1; border-radius:50%; border:0; background:var(--key); color:var(--fg); font-size:22px; display:flex; align-items:center; justify-content:center; }
  .key:active, .key.on { background:var(--key-on); transform:scale(.96); }
  .key small { display:block; font-size:10px; color:var(--muted); margin-top:2px; }
  .key svg { width:24px; height:24px; }
  .vol { display:flex; flex-direction:column; gap:10px; }
  .vol .key { aspect-ratio:auto; height:calc((100vw - 32px - 42px)/4/2 - 5px); max-height:52px; border-radius:22px; }

  h2 { font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:26px 4px 10px; }
  #apps { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
  .app { aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:#1c1c1e; border:0; padding:0; display:flex; align-items:center; justify-content:center; color:var(--fg); font-size:12px; }
  .app img { width:100%; height:100%; object-fit:cover; }
  .app:active { transform:scale(.96); }
  #cities { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
  .city { text-align:left; border:0; border-radius:14px; background:#1c1c1e; color:var(--fg); padding:12px; font-size:15px; display:flex; gap:10px; align-items:center; min-width:0; }
  .city span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .city:active { background:#2c2c2e; }
  .wide { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .pill { border:0; border-radius:14px; background:#1c1c1e; color:var(--fg); padding:14px; font-size:15px; }
  .pill:active { background:#2c2c2e; }
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 20px); transform:translateX(-50%); background:#2c2c2e; color:var(--fg); padding:10px 16px; border-radius:12px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; text-align:center; }
  #toast.show { opacity:1; }
  #bt { display:flex; flex-direction:column; gap:8px; }
  .btdev { display:flex; align-items:center; gap:12px; border:0; border-radius:14px; background:#1c1c1e; color:var(--fg); padding:14px; font-size:15px; text-align:left; width:100%; }
  .btdev:active { background:#2c2c2e; }
  .btdev svg { width:22px; height:22px; flex:none; color:var(--muted); }
  .btdev span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btdev em { font-style:normal; font-size:13px; color:var(--muted); }
  .btdev.on svg, .btdev.on em { color:var(--accent); }
  .btdev.busy em { color:#ffd60a; }
  .type { display:flex; gap:8px; margin-top:12px; }
  .type input { flex:1; min-width:0; border:0; border-radius:14px; background:#1c1c1e; color:var(--fg); padding:14px; font-size:16px; }
  .type .pill { flex:none; padding:14px 18px; }
  #keysNote { display:none; margin-top:12px; background:#2a2410; color:#ffd60a; padding:12px 14px; border-radius:14px; font-size:14px; line-height:1.4; }
  #err { display:none; background:#2c1414; color:#ff9f9a; padding:14px; border-radius:14px; margin-bottom:14px; font-size:14px; line-height:1.4; }
</style>
</head>
<body>
<header><h1>MyTV</h1><div id="status"><i></i><span>Conectado</span></div>
  <button id="power" aria-label="Prender o apagar la TV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/></svg></button></header>
<div id="err"></div>

<div id="pad" aria-label="Panel táctil: desliza para moverte, toca para elegir">
  <span class="arrow a-up">▴</span><span class="arrow a-down">▾</span><span class="arrow a-left">◂</span><span class="arrow a-right">▸</span>
  <div class="dot" id="dot"></div>
  <div class="hint">Desliza para moverte · toca para elegir</div>
</div>

<div class="row">
  <button class="key" data-k="back" aria-label="Atrás"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="key" data-k="home" aria-label="Inicio MyTV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg></button>
  <button class="key" data-k="playpause" aria-label="Reproducir o pausar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5l8 7-8 7z"/><rect x="15" y="5" width="2.4" height="14" rx="1"/><rect x="19" y="5" width="2.4" height="14" rx="1"/></svg></button>
  <div class="vol">
    <button class="key" data-k="volup" aria-label="Subir volumen">＋</button>
    <button class="key" data-k="voldown" aria-label="Bajar volumen">－</button>
  </div>
</div>
<div class="wide">
  <button class="pill" data-k="rew">⏪ Retroceder</button>
  <button class="pill" data-k="ff">Adelantar ⏩</button>
</div>
<div class="wide">
  <button class="pill" data-k="cam">📷 Otra cámara</button>
  <button class="pill" data-k="mute">🔇 Silenciar</button>
</div>

<form id="typeForm" class="type"><input id="typeIn" type="text" placeholder="Escribir en la TV (buscar en YouTube…)" autocomplete="off" autocapitalize="off" enterkeyhint="send"><button class="pill" type="submit">Enviar</button></form>
<div id="keysNote"></div>

<h2>Bluetooth</h2>
<div id="bt"><button class="btdev" id="btload"><span>Buscando equipos…</span></button></div>
<div class="wide" style="grid-template-columns:1fr"><button class="pill" data-k="btsettings">⚙︎ Ajustes de Bluetooth de la TV</button></div>

<h2>Apps</h2>
<div id="apps"></div>

<h2>Ciudades</h2>
<div id="cities"></div>

<div id="toast"></div>

<script src="https://yoan231291-sketch.github.io/mytv-launcher/cities.js"></script>
<script>
// La clave viene en el enlace (?t=...) y se guarda para la próxima vez
const qs = new URLSearchParams(location.search);
let token = qs.get('t'); try { if (token) localStorage.setItem('mytv-t', token); else token = localStorage.getItem('mytv-t'); } catch {}
const $ = id => document.getElementById(id);
let tT; const toast = m => { $('toast').textContent = m; $('toast').classList.add('show'); clearTimeout(tT); tT = setTimeout(() => $('toast').classList.remove('show'), 2400); };
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch {} };

async function send(k, v) {
  buzz();
  try {
    const r = await fetch(`/api/cmd?t=${encodeURIComponent(token || '')}&k=${k}${v ? '&v=' + encodeURIComponent(v) : ''}`, { cache:'no-store' });
    const j = await r.json(); setOnline(true);
    if (!j.ok && j.msg) toast(j.msg);
    if (r.status === 403) showErr('Este enlace no tiene la clave correcta. Abre el enlace que aparece en la TV: Ajustes → Control desde el teléfono.');
  } catch { setOnline(false); }
}
function setOnline(on) { $('status').classList.toggle('off', !on); $('status').querySelector('span').textContent = on ? 'Conectado' : 'Sin conexión con la TV'; }
function showErr(m) { $('err').textContent = m; $('err').style.display = 'block'; }

document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => send(b.dataset.k)));

// Panel táctil: deslizar = flechas (se repite si deslizas largo), tocar = OK
const pad = $('pad'), dot = $('dot'); let sx, sy, lx, ly, moved, t0;
pad.addEventListener('pointerdown', e => { pad.setPointerCapture(e.pointerId); sx = lx = e.clientX; sy = ly = e.clientY; moved = false; t0 = Date.now();
  const r = pad.getBoundingClientRect(); dot.style.left = (e.clientX - r.left) + 'px'; dot.style.top = (e.clientY - r.top) + 'px'; dot.style.opacity = 1; });
pad.addEventListener('pointermove', e => {
  if (sx == null) return;
  const r = pad.getBoundingClientRect(); dot.style.left = (e.clientX - r.left) + 'px'; dot.style.top = (e.clientY - r.top) + 'px';
  const dx = e.clientX - lx, dy = e.clientY - ly, step = 46;
  if (Math.abs(dx) > step || Math.abs(dy) > step) {
    moved = true;
    send(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    lx = e.clientX; ly = e.clientY;
  }
});
pad.addEventListener('pointerup', e => {
  dot.style.opacity = 0;
  if (!moved && Date.now() - t0 < 450) { pad.classList.add('flash'); setTimeout(() => pad.classList.remove('flash'), 120); send('ok'); }
  sx = null;
});

// Ciudades (de la misma lista que usa la TV)
(window.CITIES || []).forEach(c => {
  const b = document.createElement('button'); b.className = 'city';
  b.innerHTML = `<b>${c.flag}</b><span>${c.name}</span>`;
  b.onclick = () => { send('city', c.id); toast(c.name); };
  $('cities').appendChild(b);
});

// Apps: primero las del menú de MyTV, luego "Más apps"
async function loadApps() {
  try {
    const r = await fetch(`/api/apps?t=${encodeURIComponent(token || '')}`, { cache:'no-store' });
    if (r.status === 403) return showErr('Este enlace no tiene la clave correcta. Abre el enlace que aparece en la TV: Ajustes → Control desde el teléfono.');
    const { apps } = await r.json(); setOnline(true);
    const fav = (window.APPS || []).map(a => apps.find(x => a.pkgs.includes(x.pkg))).filter(Boolean);
    const rest = apps.filter(a => !fav.includes(a) && !/launcher|settings|screensaver|profile|ssm|vizzini|documentsui|downloads/.test(a.pkg));
    const add = (a, parent) => { const b = document.createElement('button'); b.className = 'app';
      b.innerHTML = a.icon ? `<img src="${a.icon}" alt="${a.label}">` : a.label; b.onclick = () => { send('app', a.pkg); toast('Abriendo ' + a.label); }; parent.appendChild(b); };
    fav.forEach(a => add(a, $('apps')));
    if (rest.length) {
      const more = document.createElement('button'); more.className = 'app'; more.textContent = 'Más apps…';
      more.onclick = () => { more.remove(); rest.forEach(a => add(a, $('apps'))); }; $('apps').appendChild(more);
    }
  } catch { setOnline(false); }
}
loadApps();

// Bluetooth: equipos de sonido emparejados con la TV; tocar uno lo conecta (tocar el conectado lo desconecta)
const BT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>';
async function loadBt() {
  try {
    const r = await fetch(`/api/bt?t=${encodeURIComponent(token || '')}`, { cache:'no-store' });
    if (!r.ok) return;
    const { devices } = await r.json(); setOnline(true);
    const box = $('bt'); box.innerHTML = '';
    if (!devices.length) { box.innerHTML = '<button class="btdev"><span>No hay equipos de sonido emparejados. Usa “Ajustes de Bluetooth” para emparejar uno.</span></button>'; return; }
    devices.forEach(d => {
      const b = document.createElement('button'); b.className = 'btdev' + (d.on ? ' on' : '');
      b.innerHTML = `${BT_ICON}<span></span><em>${d.on ? 'Conectado' : 'Conectar'}</em>`;
      b.querySelector('span').textContent = d.name;
      b.onclick = async () => { b.classList.add('busy'); b.querySelector('em').textContent = d.on ? 'Desconectando…' : 'Conectando…';
        await send(d.on ? 'btoff' : 'bt', d.addr); setTimeout(loadBt, 3500); setTimeout(loadBt, 8000); };
      box.appendChild(b);
    });
  } catch { setOnline(false); }
}
loadBt();

// Encendido: verde = TV prendida. Tocar prende o apaga la TV.
async function loadState() {
  try { const r = await fetch(`/api/state?t=${encodeURIComponent(token || '')}`, { cache:'no-store' }); if (!r.ok) return;
    const j = await r.json(); setOnline(true); $('power').classList.toggle('on', !!j.on);
    const n = $('keysNote');
    if (j.keys === 'esperando permiso') { n.textContent = 'Falta un paso en la TV: aparece “¿Permitir depuración?”. Marca “Permitir siempre” y acepta. Es solo una vez y hace que las flechas funcionen dentro de YouTube, Netflix y cualquier app.'; n.style.display = 'block'; }
    else n.style.display = 'none'; } catch { setOnline(false); $('power').classList.remove('on'); }
}
$('power').onclick = async () => {
  const b = $('power'); b.classList.add('busy'); const wasOn = b.classList.contains('on');
  await send('power'); toast(wasOn ? 'Apagando la TV' : 'Prendiendo la TV');
  setTimeout(() => { b.classList.remove('busy'); loadState(); loadBt(); }, 2500);
};
$('typeForm').onsubmit = async e => { e.preventDefault(); const v = $('typeIn').value.trim(); if (!v) return; await send('text', v); $('typeIn').value = ''; toast('Escrito en la TV'); };
loadState(); setInterval(() => { if (!document.hidden) loadState(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadState(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadBt(); });
</script>
</body>
</html>
