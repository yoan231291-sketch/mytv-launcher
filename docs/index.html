<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>MyTV Live Cams</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="cities.js"></script>
<style>
  /* Layout: cámara a pantalla completa; arriba solo ciudad + hora; abajo una fila horizontal de apps */
  :root { --bg:#000; --fg:#fff; --muted:rgba(255,255,255,.7); --tile:rgba(12,14,20,.55); --tile-on:rgba(255,255,255,.95); --accent:#38bdf8; color-scheme:dark; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); overflow:hidden; }

  /* ---------- Cámara ---------- */
  #camWrap { position:fixed; inset:0; overflow:hidden; background:#000; }
  /* Sin transform ni recorte: en Fire TV el video va en una capa aparte; debe quedar justo en 0,0 y del tamaño de la pantalla */
  #camWrap iframe, #player { position:absolute; top:0; left:0; width:100vw; height:100vh; pointer-events:none; border:0; transition:opacity .8s ease; }
  .spinner { width:44px; height:44px; border-radius:50%; border:3px solid rgba(255,255,255,.15); border-top-color:var(--accent); animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* Pantalla de transición: foto de la cámara mientras arranca, para no ver los controles de YouTube al cargar */
  #camCover { position:fixed; inset:0; background:#000; overflow:hidden; opacity:1; transition:opacity .9s ease; pointer-events:none; }
  /* La miniatura es de baja resolución: un leve desenfoque la hace ver como una foto de fondo y no pixelada */
  #camCover::before { content:""; position:absolute; inset:-30px; background:var(--img, none) center/cover no-repeat; filter:blur(10px) brightness(.85); }
  #camCover.off { opacity:0; }
  #camCover .pill { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:.6em;
    background:rgba(0,0,0,.55); padding:.6em 1.2em; border-radius:999px; font-size:clamp(13px,1.1vw,20px); font-weight:600; letter-spacing:.03em; }
  #camCover .pill i { width:.6em; height:.6em; border-radius:50%; background:#ef4444; animation:pulse 1.2s ease-in-out infinite; }
  /* Sombra solo arriba y abajo, para leer sin tapar la cámara */
  .shade { position:fixed; inset:0; pointer-events:none; transition:opacity .6s;
    background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 62%, rgba(0,0,0,.65) 100%); }

  /* ---------- Capa de interfaz ---------- */
  .ui { position:fixed; inset:0; transition:opacity .6s; pointer-events:none; }
  .ui > * { pointer-events:auto; }
  body.idle .ui, body.idle .shade { opacity:0; }

  .top { position:absolute; top:4.5vh; left:4vw; right:4vw; display:flex; justify-content:space-between; align-items:flex-start; text-shadow:0 1px 8px rgba(0,0,0,.6); }
  .live { display:flex; align-items:center; gap:.7em; font-size:clamp(13px,1.15vw,22px); font-weight:600; letter-spacing:.04em; }
  .live .dot { width:.6em; height:.6em; border-radius:50%; background:#ef4444; box-shadow:0 0 10px #ef4444; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .live .spot { font-weight:400; color:var(--muted); }
  /* Hora y temperatura de donde está la TV: grandes, en negrita y siempre visibles (también en modo cine) */
  #local { position:fixed; top:3.2vh; right:3.5vw; text-align:right; z-index:4; pointer-events:none; line-height:1;
    text-shadow:0 2px 6px rgba(0,0,0,.75), 0 0 28px rgba(0,0,0,.45); font-variant-numeric:tabular-nums; }
  #local .lt { font-size:clamp(56px,7.6vw,150px); font-weight:800; letter-spacing:-.03em; }
  #local .lt small { font-size:.32em; font-weight:700; letter-spacing:0; margin-left:.15em; }
  #local .lw { margin-top:.12em; font-size:clamp(30px,3.9vw,78px); font-weight:800; letter-spacing:-.01em; }
  #local .lp { margin-top:.5em; font-size:clamp(12px,1.05vw,20px); font-weight:600; color:rgba(255,255,255,.85); letter-spacing:.05em; text-transform:uppercase; }
  .live .cam { font-weight:400; color:var(--muted); }

  /* Fila de apps estilo Apple TV: mosaicos 16:9, el enfocado se levanta con sombra, brillo y leve inclinación */
  .dock { position:absolute; left:0; right:0; bottom:7vh; display:flex; justify-content:center; align-items:flex-end; gap:2vw; padding:0 4vw; perspective:900px; }
  .tile { position:relative; width:clamp(110px,10.6vw,204px); flex:none; cursor:pointer; }
  .tile .art { position:relative; aspect-ratio:16/9; border-radius:clamp(8px,.85vw,16px); overflow:hidden; background:#1c1c1e;
    box-shadow:0 6px 14px rgba(0,0,0,.45); transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s; display:flex; align-items:center; justify-content:center; }
  .tile .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .art img.icon { width:auto; height:62%; object-fit:contain; }
  .tile .art svg { width:42%; height:42%; }
  .tile .art .glyph { font-size:clamp(26px,2.6vw,50px); font-weight:800; letter-spacing:-.04em; }
  /* Brillo especular que recorre el mosaico enfocado */
  .tile .art::after { content:""; position:absolute; inset:0; background:linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.28) 48%, rgba(255,255,255,0) 66%);
    transform:translateX(-120%); opacity:0; transition:opacity .3s; pointer-events:none; }
  .tile .n { position:absolute; left:50%; top:100%; transform:translate(-50%, .9em); white-space:nowrap; font-size:clamp(12px,1vw,19px); font-weight:500;
    opacity:0; transition:opacity .25s, transform .25s; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  .tile.on .art { transform:scale(1.18) translateY(-6%); box-shadow:0 26px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.25); animation:tilt 4s ease-in-out infinite alternate; }
  .tile.on .art::after { opacity:1; animation:glare 2.6s ease-in-out .3s infinite; }
  .tile.on .n { opacity:1; transform:translate(-50%, 1.7em); }
  body.idle .tile .art, body.idle .tile .art::after { animation:none !important; }   /* sin animar cuando la interfaz está oculta */
  @keyframes tilt { from { transform:scale(1.18) translateY(-6%) rotateX(3deg) rotateY(-4deg); } to { transform:scale(1.18) translateY(-6%) rotateX(-2deg) rotateY(4deg); } }
  @keyframes glare { 0% { transform:translateX(-120%); } 55%,100% { transform:translateX(120%); } }
  /* Íconos de sistema (fondos degradados como en tvOS) */
  .bg-cities { background:linear-gradient(160deg,#3a8dde,#1b4f9c) !important; }
  .bg-all    { background:linear-gradient(160deg,#4a4a52,#232328) !important; }
  .bg-set    { background:linear-gradient(160deg,#9a9aa2,#5d5d66) !important; }

  /* Aviso de ciudad al cambiar */
  #cityToast { position:fixed; left:4vw; top:50%; transform:translateY(-50%); font-size:clamp(22px,2.6vw,52px); font-weight:300; text-shadow:0 2px 14px rgba(0,0,0,.7);
    opacity:0; transition:opacity .4s; pointer-events:none; }
  #cityToast small { display:block; font-size:.45em; color:var(--muted); margin-top:.3em; font-weight:400; }
  #cityToast.show { opacity:1; }

  /* Rejillas: ciudades y todas las apps */
  .overlay { position:fixed; inset:0; background:rgba(4,6,10,.88); display:none; padding:7vh 5vw; z-index:5; }
  .overlay.open { display:block; }
  .overlay h2 { margin:0 0 3vh; font-weight:300; font-size:clamp(22px,2.2vw,40px); }
  .grid { display:grid; grid-template-columns:repeat(var(--cols,6), minmax(0,1fr)); gap:1.3vw; max-height:78vh; overflow-y:auto; padding:10px; }
  .cell { aspect-ratio:16/9; border-radius:14px; background:rgba(255,255,255,.07); border:2px solid transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4em; padding:8px; transition:transform .15s, border-color .15s, background .15s; }
  .cell img { max-height:60%; max-width:90%; object-fit:contain; }
  .cell .big { font-size:clamp(22px,2.4vw,44px); }
  .cell span { font-size:clamp(11px,.9vw,17px); color:rgba(255,255,255,.85); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .cell small { font-size:clamp(10px,.75vw,14px); color:rgba(255,255,255,.5); }
  .cell.on { border-color:#fff; transform:scale(1.07); background:rgba(255,255,255,.16); }
  .cell svg { width:34%; height:34%; }

  #toast { position:fixed; bottom:calc(6vh + 13vw); left:50%; transform:translateX(-50%); background:rgba(10,12,18,.85); padding:.7em 1.3em; border-radius:12px;
    font-size:clamp(13px,1vw,18px); opacity:0; transition:opacity .3s; pointer-events:none; z-index:6; }
  #toast.show { opacity:1; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<div id="camWrap"><div id="player"></div></div>
<div id="camCover"><div class="pill"><i></i>Conectando en vivo…</div></div>
<div class="shade"></div>

<div class="ui">
  <div class="top">
    <div class="live"><span class="dot"></span><span id="cityName">EN VIVO</span><span class="spot" id="citySpot"></span><span class="cam" id="camInfo"></span></div>
  </div>
  <div class="dock" id="dock"></div>
</div>

<div id="local"><div class="lt" id="localTime">--:--</div><div class="lw" id="localWeather">&nbsp;</div><div class="lp" id="localPlace"></div></div>

<div id="cityToast"></div>

<div class="overlay" id="ovCities"><h2>Elige una ciudad</h2><div class="grid" id="gridCities" style="--cols:4"></div></div>
<div class="overlay" id="ovSettings"><h2>Ajustes</h2><div class="grid" id="gridSettings" style="--cols:4"></div></div>
<div class="overlay" id="ovApps"><h2>Todas las apps</h2><div class="grid" id="gridApps" style="--cols:6"></div></div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const TV = typeof window.AndroidTV !== 'undefined';
const CITIES = window.CITIES, APPS = window.APPS;
const store = { get(k,d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let cityIdx = Math.max(0, CITIES.findIndex(c => c.id === store.get('city','tokyo')));
let camIdx = 0, failCount = 0, player = null, playerReady = false, cams = [];
const city = () => CITIES[cityIdx];
const log = (...a) => console.log('[MyTV]', ...a);

// ---------- Íconos (SVG simples, estilo tvOS) ----------
const ICON = {
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.5 4.5l1.9 1.9M17.6 17.6l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.5 19.5l1.9-1.9M17.6 6.4l1.9-1.9"/></svg>',
  wifi:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.3a9.5 9.5 0 0 1 13 0M8.6 15.6a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19" r="1.2" fill="#fff"/></svg>',
  tv:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8"/></svg>',
  apps:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/></svg>',
  remote:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><rect x="7" y="2.5" width="10" height="19" rx="3"/><circle cx="12" cy="8" r="2"/><path d="M10 14h4M10 17h4"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".9" fill="#fff"/></svg>',
  sliders:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  person:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  access:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><circle cx="12" cy="4.5" r="1.6"/><path d="M5 8l7 1.5L19 8M12 9.5V15M12 15l-3.5 6M12 15l3.5 6"/></svg>',
};
const S = 'com.amazon.tv.settings.v2/.tv.';
const SETTINGS = [
  { name:'Red',                  icon:'wifi',    target:S+'network.NetworkActivity' },
  { name:'Pantalla y sonido',    icon:'tv',      target:S+'display_sounds.DisplayAndSoundsActivity' },
  { name:'Aplicaciones',         icon:'apps',    target:S+'applications.ApplicationsActivity' },
  { name:'Controles y Bluetooth',icon:'remote',  target:S+'controllers_bluetooth_devices.ControllersAndBluetoothActivity' },
  { name:'Preferencias',         icon:'sliders', target:S+'preferences.PreferencesActivity' },
  { name:'Mi Fire TV',           icon:'info',    target:S+'device.DeviceActivity' },
  { name:'Cuenta',               icon:'person',  target:S+'my_account.MyAccountActivity' },
  { name:'Accesibilidad',        icon:'access',  target:S+'accessibility.AccessibilityActivity' },
];

// ---------- Dock: tus apps instaladas (con su ícono real) + Ciudades, Todas y Ajustes ----------
let installed = {};                                   // paquete -> { label, icon }
if (TV) { try { JSON.parse(AndroidTV.getApps()).forEach(a => installed[a.pkg] = a); } catch {} }
const DOCK = [
  ...APPS.map(a => ({ ...a, kind:'app', pkg: a.pkgs.find(p => installed[p]) }))
         .filter(a => !TV || a.pkg),                 // en la TV solo mostramos las apps instaladas
  { name:'Ciudades', kind:'cities',   icon:'globe', bg:'bg-cities' },
  { name:'Todas',    kind:'all',      icon:'grid',  bg:'bg-all' },
  { name:'Ajustes',  kind:'settings', icon:'gear',  bg:'bg-set' },
];
let dockIdx = 0;
function tileArt(d) {
  if (d.kind !== 'app') return `<div class="art ${d.bg}">${ICON[d.icon]}</div>`;
  const real = d.pkg && installed[d.pkg] && installed[d.pkg].icon;
  if (real) {
    const img = new Image(); img.src = real;      // banner 16:9 a pantalla completa; ícono cuadrado centrado
    const wide = img.naturalWidth ? img.naturalWidth / img.naturalHeight > 1.3 : true;
    return `<div class="art"><img class="${wide ? '' : 'icon'}" src="${real}" alt=""></div>`;
  }
  return `<div class="art" style="background:linear-gradient(160deg,#26262b,#111114)"><span class="glyph" style="color:${d.color}">${d.mark}</span></div>`;
}
function renderDock() {
  $('dock').innerHTML = DOCK.map((d,i) => `<div class="tile${i===dockIdx?' on':''}">${tileArt(d)}<div class="n">${d.name}</div></div>`).join('');
  [...$('dock').children].forEach((el,i) => el.onclick = () => { dockIdx = i; paintDock(); activate(DOCK[i]); });
  // Ajusta íconos cuadrados cuando la imagen termina de cargar
  $('dock').querySelectorAll('.art img').forEach(img => img.onload = () => img.classList.toggle('icon', img.naturalWidth / img.naturalHeight < 1.3));
}
const paintDock = () => [...$('dock').children].forEach((el,i) => el.classList.toggle('on', i === dockIdx));
function activate(d) {
  if (d.kind === 'app') {
    if (!TV) return toast('Abriendo ' + d.name + '…');
    if (!AndroidTV.launch(d.pkgs.join(','))) toast(d.name + ' no está instalada');
  } else if (d.kind === 'cities') openOverlay('cities');
  else if (d.kind === 'all') openOverlay('apps');
  else if (d.kind === 'settings') openOverlay('settings');
}

// ---------- Rejillas (ciudades / todas las apps / ajustes) ----------
const OV = { cities:'ovCities', apps:'ovApps', settings:'ovSettings' }, GRID = { cities:'gridCities', apps:'gridApps', settings:'gridSettings' };
let ov = null, ovIdx = 0, ovItems = [];
function openOverlay(kind) {
  if (kind === 'apps') {
    if (!TV) return toast('Disponible en la TV');
    try { ovItems = JSON.parse(AndroidTV.getApps()); } catch { ovItems = []; }
    $('gridApps').innerHTML = ovItems.map(a => `<div class="cell">${a.icon?`<img src="${a.icon}" alt="">`:''}<span>${a.label}</span></div>`).join('');
    ovIdx = 0;
  } else if (kind === 'settings') {
    ovItems = SETTINGS;
    $('gridSettings').innerHTML = SETTINGS.map(x => `<div class="cell">${ICON[x.icon]}<span>${x.name}</span></div>`).join('');
    ovIdx = 0;
  } else {
    ovItems = CITIES;
    $('gridCities').innerHTML = CITIES.map(c => `<div class="cell"><div class="big">${c.flag}</div><span>${c.name}</span><small>${c.spot} · <b data-tz="${c.tz}"></b></small></div>`).join('');
    ovIdx = cityIdx; tickClocks();
  }
  ov = kind; $(OV[kind]).classList.add('open');
  [...grid().children].forEach((el,i) => el.onclick = () => { ovIdx = i; pickOverlay(); });
  moveOv(0);
}
const grid = () => $(GRID[ov]);
function closeOverlay() { if (!ov) return; $(OV[ov]).classList.remove('open'); ov = null; }
function moveOv(d) {
  const cells = grid().children; if (!cells.length) return;
  ovIdx = Math.min(cells.length - 1, Math.max(0, ovIdx + d));
  [...cells].forEach((c,i) => c.classList.toggle('on', i === ovIdx));
  cells[ovIdx].scrollIntoView({ block:'nearest' });
}
function pickOverlay() {
  const kind = ov, item = ovItems[ovIdx]; closeOverlay();
  if (!item) return;
  if (kind === 'apps') AndroidTV.launch(item.pkg);
  else if (kind === 'settings') {
    if (!TV) return toast('Disponible en la TV');
    const ok = typeof AndroidTV.openSetting === 'function' && AndroidTV.openSetting(item.target);
    if (!ok) AndroidTV.openSettings();             // versión anterior de la app o pantalla no disponible
  }
  else selectCity(ovIdx, true);
}

// ---------- Ciudad y cámara (con auto-reparación) ----------
// Cámaras que fallaron: se evitan durante 12 h (los enlaces de YouTube en vivo cambian cada pocos días)
const BAD_MS = 12 * 3600e3;
const badMap = store.get('badCams', {});
const isBad = v => badMap[v] && Date.now() - badMap[v] < BAD_MS;
function markBad(v) { if (!v) return; badMap[v] = Date.now(); store.set('badCams', badMap); }
// Lista de la ciudad: primero las de cities.js (revisadas a mano, sin marca de agua), luego las que encontró la TV buscando
function buildCams(c) { return [...new Set([...c.cams, ...store.get('found:' + c.id, [])])].filter(v => !isBad(v)); }

function selectCity(i, announce) {
  cityIdx = (i + CITIES.length) % CITIES.length; camIdx = 0; failCount = 0;
  store.set('city', city().id);
  $('cityName').textContent = city().name;
  $('citySpot').textContent = '· ' + city().spot;
  if (announce) showCityToast();
  cams = buildCams(city()); qIdx = 0;
  loadWeather(); tickClocks();
  if (!cams.length) discover(); else playCurrent();
}

// Cuando una ciudad se queda sin cámaras: la TV busca en YouTube transmisiones EN VIVO nuevas.
let qIdx = 0, skips = 0, pauseT;
const searched = store.get('searched', {});
function discover() {
  const c = city(), queries = c.q || [c.name + ' live cam'];
  const canSearch = TV && typeof AndroidTV.findLive === 'function';
  const recently = searched[c.id] && Date.now() - searched[c.id] < 30 * 60e3 && qIdx === 0;
  if (canSearch && !recently && qIdx < queries.length) {
    toast('Buscando cámaras en vivo de ' + c.name + '…');
    log('buscando', queries[qIdx]);
    AndroidTV.findLive(queries[qIdx], c.id, 'onLiveFound');
    return;
  }
  skipCity();
}
window.onLiveFound = (tag, ids) => {
  ids = (ids || []).filter(v => !isBad(v));
  log('encontradas', tag, ids.join(','));
  if (ids.length) store.set('found:' + tag, ids);
  if (tag !== city().id) return;
  searched[tag] = Date.now(); store.set('searched', searched);
  if (ids.length) { cams = ids; camIdx = 0; playCurrent(); }
  else { qIdx++; discover(); }
};
// Sin cámaras en esta ciudad: pasa a la siguiente. Si ninguna ciudad tiene, espera 5 min y reintenta.
function skipCity() {
  if (++skips >= CITIES.length) {
    skips = 0; toast('No hay cámaras disponibles ahora. Reintento en 5 minutos.');
    clearTimeout(pauseT); pauseT = setTimeout(() => selectCity(cityIdx, false), 5 * 60e3); return;
  }
  toast(city().name + ': sin cámaras en vivo ahora, paso a la siguiente ciudad');
  setTimeout(() => selectCity(cityIdx + 1, true), 1200);
}
let ctT;
function showCityToast() {
  $('cityToast').innerHTML = `${city().flag} ${city().name}<small>${city().spot} · ${fmt(city().tz)}</small>`;
  $('cityToast').classList.add('show'); clearTimeout(ctT); ctT = setTimeout(() => $('cityToast').classList.remove('show'), 2500);
}

function onYouTubeIframeAPIReady() {
  log('API lista');
  player = new YT.Player('player', {
    videoId: (cams = buildCams(city()))[0] || city().cams[0],
    playerVars: { autoplay:1, mute:1, controls:0, disablekb:1, fs:0, iv_load_policy:3, modestbranding:1, playsinline:1, rel:0, origin: location.origin },
    events: {
      onReady: e => { log('player listo'); fitCam(); playerReady = true; selectCity(cityIdx); },
      onStateChange: e => {
        log('estado', e.data);
        if (e.data === YT.PlayerState.PLAYING) { failCount = 0; skips = 0; clearTimeout(coverT); coverT = setTimeout(coverOff, 3000); setTimeout(hideYtControls, 1200); }
        if (e.data === YT.PlayerState.ENDED) nextCam(true);
      },
      onError: e => { log('error', e.data); nextCam(true); }
    }
  });
}
// Video exactamente del tamaño de la pantalla, empezando en 0,0.
// En Fire TV la capa de video se recorta mal si empieza fuera de pantalla (deja franja negra), así que nada de "agrandar".
function fitCam() {
  const el = document.getElementById('player'); if (!el) return;
  Object.assign(el.style, { left:'0px', top:'0px', width: innerWidth + 'px', height: innerHeight + 'px' });
}
addEventListener('resize', fitCam);
let revealT, watchT, coverT;
// Cubre el video con la foto de la cámara hasta que lleva 3 s reproduciéndose (los controles de YouTube ya se ocultaron).
// Máximo 12 s: si YouTube pone un anuncio, se ve como siempre.
function coverOn(id) {
  const c = $('camCover');
  c.style.setProperty('--img', `url(https://i.ytimg.com/vi/${id}/sddefault_live.jpg)`);
  c.classList.remove('off'); clearTimeout(coverT); coverT = setTimeout(coverOff, 12000);
}
function coverOff() { clearTimeout(coverT); $('camCover').classList.add('off'); }
// Esconde los controles de YouTube: un "puntero" entra al video y sale (la app de la TV lo simula).
let nudgeT = 0;
function hideYtControls() {
  if (!TV || typeof AndroidTV.hoverNudge !== 'function' || Date.now() - nudgeT < 1500) return;
  nudgeT = Date.now();
  const el = document.getElementById('player'); if (!el) return;
  el.style.pointerEvents = 'auto'; AndroidTV.hoverNudge();
  setTimeout(() => { el.style.pointerEvents = 'none'; }, 350);
}
// Y por si vuelven a aparecer (cambio de anuncio a cámara, cortes), repetimos cada 45 s mientras se reproduce
setInterval(() => { try { if (playerReady && player.getPlayerState() === 1 && !ov) hideYtControls(); } catch {} }, 45000);
function playCurrent() {
  if (!playerReady || !cams.length) return;
  const want = cams[camIdx];
  coverOn(want);
  player.loadVideoById(want); player.mute(); player.playVideo();
  // Vigilante: si en 40 s la cámara no está reproduciendo (caída o trabada), pasa a la siguiente.
  // 40 s y no menos: YouTube a veces pone 1–2 anuncios de 15 s antes del en vivo.
  clearTimeout(watchT);
  watchT = setTimeout(() => { if (player.getPlayerState() !== 1 && cams[camIdx] === want) { log('cámara trabada', want); nextCam(true); } }, 40000);
}
function nextCam(auto, dir = 1) {
  if (auto) {                                  // falló: se marca, se quita y se prueba la siguiente
    clearTimeout(watchT);
    markBad(cams[camIdx]); cams.splice(camIdx, 1);
    if (!cams.length) return discover();
    camIdx = camIdx % cams.length; return playCurrent();
  }
  const n = cams.length; if (!n) return;
  camIdx = (camIdx + dir + n) % n;
  toast(`Cámara ${camIdx + 1} de ${n}`);
  playCurrent();
}
// Latido para el vigilante de la app: solo mientras la cámara se reproduce de verdad
setInterval(() => { try { if (TV && AndroidTV.alive && playerReady && player.getPlayerState() === 1) AndroidTV.alive(); } catch {} }, 20000);
// Cada 6 h, si nadie está usando la TV (interfaz oculta), recarga para liberar memoria y tomar cambios
setInterval(() => { if (performance.now() > 6 * 3600e3 && document.body.classList.contains('idle') && !ov) location.reload(); }, 60e3);
// Al volver de otra app, retoma la cámara
document.addEventListener('visibilitychange', () => { if (!document.hidden && playerReady) { player.mute(); player.playVideo(); } });

// ---------- Hora y clima ----------
const fmt = tz => new Intl.DateTimeFormat('es', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:tz }).format(new Date());
let camWeather = '';
function tickClocks() {
  $('camInfo').textContent = `· ${fmt(city().tz)}${camWeather ? ' · ' + camWeather : ''}`;
  document.querySelectorAll('[data-tz]').forEach(el => el.textContent = fmt(el.dataset.tz));
  // Hora local de la TV (zona horaria del televisor), formato 12 h
  const d = new Date(), h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  $('localTime').innerHTML = `${h % 12 || 12}:${m}<small>${h < 12 ? 'AM' : 'PM'}</small>`;
}
setInterval(tickClocks, 5000);
const WMO = { 0:['Despejado','☀️','🌙'], 1:['Despejado','🌤','🌙'], 2:['Algo nublado','⛅','☁️'], 3:['Nublado','☁️','☁️'], 45:['Neblina','🌫','🌫'], 48:['Neblina','🌫','🌫'],
  51:['Llovizna','🌦','🌧'], 53:['Llovizna','🌦','🌧'], 55:['Llovizna','🌧','🌧'], 61:['Lluvia','🌧','🌧'], 63:['Lluvia','🌧','🌧'], 65:['Lluvia fuerte','🌧','🌧'],
  71:['Nieve','🌨','🌨'], 73:['Nieve','🌨','🌨'], 75:['Nevada','❄️','❄️'], 80:['Chubascos','🌦','🌧'], 81:['Chubascos','🌧','🌧'], 82:['Chubascos','⛈','⛈'], 95:['Tormenta','⛈','⛈'], 96:['Tormenta','⛈','⛈'], 99:['Tormenta','⛈','⛈'] };
const meteo = (lat, lon) => fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&timezone=auto`).then(r => r.json()).then(j => j.current);
let wReq = 0;
async function loadWeather() {                       // clima de la ciudad de la cámara (pequeño)
  const c = city(), req = ++wReq;
  try {
    const cur = await meteo(c.lat, c.lon); if (req !== wReq) return;
    const w = WMO[cur.weather_code] || ['','🌡','🌡'];
    camWeather = `${cur.is_day ? w[1] : w[2]} ${Math.round(cur.temperature_2m*9/5+32)}°F`;
  } catch { camWeather = ''; }
  tickClocks();
}
setInterval(loadWeather, 15 * 60 * 1000);

// Ubicación de la TV: aproximada por internet (sin GPS). Si falla, Indianápolis.
async function tvLocation() {
  const saved = store.get('tvLoc', null);
  if (saved && Date.now() - saved.t < 24 * 3600e3) return saved;
  try {
    const g = await fetch('https://get.geojs.io/v1/ip/geo.json').then(r => r.json());
    const loc = { lat: +g.latitude, lon: +g.longitude, name: g.city || g.region || '', t: Date.now() };
    if (isFinite(loc.lat) && isFinite(loc.lon)) { store.set('tvLoc', loc); return loc; }
  } catch {}
  return { lat: 39.768, lon: -86.158, name: 'Indianapolis' };
}
async function loadLocalWeather() {                  // clima de donde está la TV (grande)
  const loc = await tvLocation();
  $('localPlace').textContent = loc.name;
  try {
    const cur = await meteo(loc.lat, loc.lon), w = WMO[cur.weather_code] || ['','🌡','🌡'];
    $('localWeather').textContent = `${cur.is_day ? w[1] : w[2]} ${Math.round(cur.temperature_2m*9/5+32)}°F`;
  } catch { $('localWeather').innerHTML = '&nbsp;'; }
}
setInterval(loadLocalWeather, 15 * 60 * 1000);

// ---------- Ocultar la interfaz sola para ver la cámara ----------
let idleT;
function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!ov) document.body.classList.add('idle'); }, 12000); }
const isIdle = () => document.body.classList.contains('idle');

let tT;
function toast(m) { $('toast').textContent = m; $('toast').classList.add('show'); clearTimeout(tT); tT = setTimeout(() => $('toast').classList.remove('show'), 2200); }

// ---------- Control remoto ----------
// Teclas que manda la app nativa: back, menu, playpause, ff, rew
window.tvKey = k => {
  if (k === 'back') { if (ov) closeOverlay(); else if (isIdle()) wake(); else { document.body.classList.add('idle'); clearTimeout(idleT); } return; }
  if (k === 'ff')  { nextCam(false, 1); return; }
  if (k === 'rew') { nextCam(false, -1); return; }
  if (k === 'playpause') { isIdle() ? wake() : (document.body.classList.add('idle'), clearTimeout(idleT)); return; }
  if (k === 'menu') { wake(); ov ? closeOverlay() : openOverlay('cities'); }
};

document.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(k)) e.preventDefault();
  if (ov) {
    wake();
    const cols = getComputedStyle(grid()).gridTemplateColumns.split(' ').length;
    if (k === 'ArrowRight') moveOv(1); else if (k === 'ArrowLeft') moveOv(-1);
    else if (k === 'ArrowDown') moveOv(cols); else if (k === 'ArrowUp') moveOv(-cols);
    else if (k === 'Enter') pickOverlay();
    else if (k === 'Escape' || k === 'Backspace') closeOverlay();
    return;
  }
  // ▲▼ cambian de ciudad incluso con la interfaz oculta (como cambiar de canal)
  if (k === 'ArrowUp')   { selectCity(cityIdx - 1, true); return; }
  if (k === 'ArrowDown') { selectCity(cityIdx + 1, true); return; }
  if (isIdle()) { wake(); return; }           // la primera tecla solo muestra la interfaz
  wake();
  if (k === 'ArrowRight') { dockIdx = Math.min(DOCK.length - 1, dockIdx + 1); paintDock(); }
  else if (k === 'ArrowLeft') { dockIdx = Math.max(0, dockIdx - 1); paintDock(); }
  else if (k === 'Enter') activate(DOCK[dockIdx]);
  else if (k === 'c' || k === 'C') nextCam(false, 1);
  else if (k === 'Escape') window.tvKey('back');
});
document.addEventListener('mousemove', wake);

// ---------- Inicio ----------
renderDock();
$('cityName').textContent = city().name; $('citySpot').textContent = '· ' + city().spot;
tickClocks(); loadWeather(); loadLocalWeather(); wake();
setTimeout(() => toast('◄ ► apps   ·   ▲ ▼ ciudad   ·   ⏩ cámara'), 1500);
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
