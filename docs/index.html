<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>MyTV Live Cams</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="cities.js"></script>
<style>
  /* Layout: cámara a pantalla completa; arriba solo ciudad + hora; abajo una fila horizontal de apps */
  :root { --bg:#000; --fg:#fff; --muted:rgba(255,255,255,.7); --tile:rgba(12,14,20,.55); --tile-on:rgba(255,255,255,.95); --accent:#38bdf8; color-scheme:dark; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); overflow:hidden; }

  /* ---------- Cámara ---------- */
  #camWrap { position:fixed; inset:0; overflow:hidden; background:#000; }
  /* Sin transform: en Fire TV el video va en una capa aparte que ignora transform/scale. Tamaño y posición los pone fitCam() */
  #camWrap iframe, #player { position:absolute; top:0; left:0; width:100vw; height:100vh; pointer-events:none; border:0; transition:opacity .8s ease; }
  #camWrap.loading iframe { opacity:0; }
  #loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; transition:opacity .6s; }
  #camWrap:not(.loading) + #loader { opacity:0; }
  .spinner { width:44px; height:44px; border-radius:50%; border:3px solid rgba(255,255,255,.15); border-top-color:var(--accent); animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* Sombra solo arriba y abajo, para leer sin tapar la cámara */
  .shade { position:fixed; inset:0; pointer-events:none; transition:opacity .6s;
    background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 62%, rgba(0,0,0,.65) 100%); }

  /* ---------- Capa de interfaz ---------- */
  .ui { position:fixed; inset:0; transition:opacity .6s; pointer-events:none; }
  .ui > * { pointer-events:auto; }
  body.idle .ui, body.idle .shade { opacity:0; }

  .top { position:absolute; top:4.5vh; left:4vw; right:4vw; display:flex; justify-content:space-between; align-items:flex-start; text-shadow:0 1px 8px rgba(0,0,0,.6); }
  .live { display:flex; align-items:center; gap:.7em; font-size:clamp(13px,1.15vw,22px); font-weight:600; letter-spacing:.04em; }
  .live .dot { width:.6em; height:.6em; border-radius:50%; background:#ef4444; box-shadow:0 0 10px #ef4444; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .live .spot { font-weight:400; color:var(--muted); }
  .clock { text-align:right; }
  .clock .t { font-size:clamp(28px,3.3vw,64px); font-weight:300; line-height:1; font-variant-numeric:tabular-nums; }
  .clock .w { margin-top:.45em; font-size:clamp(12px,1vw,19px); color:var(--muted); font-variant-numeric:tabular-nums; }

  /* Fila horizontal de apps */
  .dock { position:absolute; left:0; right:0; bottom:6vh; display:flex; justify-content:center; gap:1.4vw; padding:0 4vw; }
  .tile { width:clamp(96px,9.2vw,176px); aspect-ratio:16/10; border-radius:14px; background:var(--tile); border:1px solid rgba(255,255,255,.12);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.35em; cursor:pointer;
    transition:transform .2s cubic-bezier(.2,.8,.2,1), background .2s, box-shadow .2s; }
  .tile .m { font-size:clamp(20px,2.2vw,42px); font-weight:800; letter-spacing:-.04em; line-height:1; }
  .tile .n { font-size:clamp(10px,.8vw,15px); color:rgba(255,255,255,.75); opacity:0; transition:opacity .2s; white-space:nowrap; }
  .tile.on { transform:translateY(-10%) scale(1.14); background:rgba(255,255,255,.18); border-color:var(--tile-on); box-shadow:0 12px 30px rgba(0,0,0,.55), 0 0 0 2px var(--tile-on); }
  .tile.on .n { opacity:1; color:#fff; }
  .tile.sys .m { font-size:clamp(18px,1.8vw,34px); font-weight:400; }

  /* Aviso de ciudad al cambiar */
  #cityToast { position:fixed; left:4vw; top:50%; transform:translateY(-50%); font-size:clamp(22px,2.6vw,52px); font-weight:300; text-shadow:0 2px 14px rgba(0,0,0,.7);
    opacity:0; transition:opacity .4s; pointer-events:none; }
  #cityToast small { display:block; font-size:.45em; color:var(--muted); margin-top:.3em; font-weight:400; }
  #cityToast.show { opacity:1; }

  /* Rejillas: ciudades y todas las apps */
  .overlay { position:fixed; inset:0; background:rgba(4,6,10,.88); display:none; padding:7vh 5vw; z-index:5; }
  .overlay.open { display:block; }
  .overlay h2 { margin:0 0 3vh; font-weight:300; font-size:clamp(22px,2.2vw,40px); }
  .grid { display:grid; grid-template-columns:repeat(var(--cols,6), minmax(0,1fr)); gap:1.3vw; max-height:78vh; overflow-y:auto; padding:10px; }
  .cell { aspect-ratio:16/9; border-radius:14px; background:rgba(255,255,255,.07); border:2px solid transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4em; padding:8px; transition:transform .15s, border-color .15s, background .15s; }
  .cell img { max-height:60%; max-width:90%; object-fit:contain; }
  .cell .big { font-size:clamp(22px,2.4vw,44px); }
  .cell span { font-size:clamp(11px,.9vw,17px); color:rgba(255,255,255,.85); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .cell small { font-size:clamp(10px,.75vw,14px); color:rgba(255,255,255,.5); }
  .cell.on { border-color:#fff; transform:scale(1.07); background:rgba(255,255,255,.16); }

  #toast { position:fixed; bottom:calc(6vh + 13vw); left:50%; transform:translateX(-50%); background:rgba(10,12,18,.85); padding:.7em 1.3em; border-radius:12px;
    font-size:clamp(13px,1vw,18px); opacity:0; transition:opacity .3s; pointer-events:none; z-index:6; }
  #toast.show { opacity:1; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<div id="camWrap" class="loading"><div id="player"></div></div>
<div id="loader"><div class="spinner"></div></div>
<div class="shade"></div>

<div class="ui">
  <div class="top">
    <div class="live"><span class="dot"></span><span id="cityName">EN VIVO</span><span class="spot" id="citySpot"></span></div>
    <div class="clock"><div class="t" id="clock">--:--</div><div class="w" id="weather">&nbsp;</div></div>
  </div>
  <div class="dock" id="dock"></div>
</div>

<div id="cityToast"></div>

<div class="overlay" id="ovCities"><h2>Elige una ciudad</h2><div class="grid" id="gridCities" style="--cols:4"></div></div>
<div class="overlay" id="ovApps"><h2>Todas las apps</h2><div class="grid" id="gridApps" style="--cols:6"></div></div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const TV = typeof window.AndroidTV !== 'undefined';
const CITIES = window.CITIES, APPS = window.APPS;
const store = { get(k,d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let cityIdx = Math.max(0, CITIES.findIndex(c => c.id === store.get('city','tokyo')));
let camIdx = 0, failCount = 0, player = null, playerReady = false;
const city = () => CITIES[cityIdx];
const log = (...a) => console.log('[MyTV]', ...a);

// ---------- Dock horizontal: apps + Ciudades + Todas + Ajustes ----------
const DOCK = [
  ...APPS.map(a => ({ ...a, kind:'app' })),
  { name:'Ciudades', mark:'🌎', kind:'cities' },
  { name:'Todas',    mark:'▦',  kind:'all' },
  { name:'Ajustes',  mark:'⚙',  kind:'settings' },
];
let dockIdx = 0;
function renderDock() {
  $('dock').innerHTML = DOCK.map((d,i) =>
    `<div class="tile${d.kind!=='app'?' sys':''}${i===dockIdx?' on':''}"><div class="m" style="color:${d.color||'#fff'}">${d.mark}</div><div class="n">${d.name}</div></div>`).join('');
  [...$('dock').children].forEach((el,i) => el.onclick = () => { dockIdx = i; paintDock(); activate(DOCK[i]); });
}
const paintDock = () => [...$('dock').children].forEach((el,i) => el.classList.toggle('on', i === dockIdx));
function activate(d) {
  if (d.kind === 'app') {
    if (!TV) return toast('Abriendo ' + d.name + '…');
    if (!AndroidTV.launch(d.pkgs.join(','))) toast(d.name + ' no está instalada');
  } else if (d.kind === 'cities') openOverlay('cities');
  else if (d.kind === 'all') openOverlay('apps');
  else if (d.kind === 'settings') TV ? AndroidTV.openSettings() : toast('Ajustes disponibles en la TV');
}

// ---------- Rejillas (ciudades / todas las apps) ----------
let ov = null, ovIdx = 0, ovItems = [];
function openOverlay(kind) {
  if (kind === 'apps') {
    if (!TV) return toast('Disponible en la TV');
    try { ovItems = JSON.parse(AndroidTV.getApps()); } catch { ovItems = []; }
    $('gridApps').innerHTML = ovItems.map(a => `<div class="cell">${a.icon?`<img src="${a.icon}" alt="">`:''}<span>${a.label}</span></div>`).join('');
    ovIdx = 0;
  } else {
    ovItems = CITIES;
    $('gridCities').innerHTML = CITIES.map(c => `<div class="cell"><div class="big">${c.flag}</div><span>${c.name}</span><small>${c.spot} · <b data-tz="${c.tz}"></b></small></div>`).join('');
    ovIdx = cityIdx; tickClocks();
  }
  ov = kind; $(kind === 'apps' ? 'ovApps' : 'ovCities').classList.add('open');
  [...grid().children].forEach((el,i) => el.onclick = () => { ovIdx = i; pickOverlay(); });
  moveOv(0);
}
const grid = () => $(ov === 'apps' ? 'gridApps' : 'gridCities');
function closeOverlay() { if (!ov) return; $(ov === 'apps' ? 'ovApps' : 'ovCities').classList.remove('open'); ov = null; }
function moveOv(d) {
  const cells = grid().children; if (!cells.length) return;
  ovIdx = Math.min(cells.length - 1, Math.max(0, ovIdx + d));
  [...cells].forEach((c,i) => c.classList.toggle('on', i === ovIdx));
  cells[ovIdx].scrollIntoView({ block:'nearest' });
}
function pickOverlay() {
  if (ov === 'apps') { const a = ovItems[ovIdx]; closeOverlay(); if (a) AndroidTV.launch(a.pkg); }
  else { closeOverlay(); selectCity(ovIdx, true); }
}

// ---------- Ciudad y cámara ----------
function selectCity(i, announce) {
  cityIdx = (i + CITIES.length) % CITIES.length; camIdx = 0; failCount = 0;
  store.set('city', city().id);
  $('cityName').textContent = city().name;
  $('citySpot').textContent = '· ' + city().spot;
  if (announce) showCityToast();
  playCurrent(); loadWeather(); tickClocks();
}
let ctT;
function showCityToast() {
  $('cityToast').innerHTML = `${city().flag} ${city().name}<small>${city().spot} · ${fmt(city().tz)}</small>`;
  $('cityToast').classList.add('show'); clearTimeout(ctT); ctT = setTimeout(() => $('cityToast').classList.remove('show'), 2500);
}

function onYouTubeIframeAPIReady() {
  log('API lista');
  player = new YT.Player('player', {
    videoId: city().cams[camIdx],
    playerVars: { autoplay:1, mute:1, controls:0, disablekb:1, fs:0, iv_load_policy:3, modestbranding:1, playsinline:1, rel:0, origin: location.origin },
    events: {
      onReady: e => { log('player listo'); fitCam(); setTimeout(() => $('camWrap').classList.remove('loading'), 1500); e.target.mute(); e.target.playVideo(); selectCity(cityIdx); playerReady = true; },  // sin recargar el mismo video
      onStateChange: e => {
        log('estado', e.data);
        if (e.data === YT.PlayerState.PLAYING) { $('camWrap').classList.remove('loading'); failCount = 0; }
        if (e.data === YT.PlayerState.ENDED) nextCam(true);
      },
      onError: e => { log('error', e.data); nextCam(true); }
    }
  });
}
// Llena toda la pantalla (como "cover") con medidas en píxeles; 1.08 recorta un poco los bordes negros de algunas cámaras
function fitCam() {
  const el = document.getElementById('player'); if (!el) return;
  const W = innerWidth, H = innerHeight, w = Math.ceil(Math.max(W, H * 16 / 9) * 1.08), h = Math.ceil(w * 9 / 16);
  Object.assign(el.style, { width: w + 'px', height: h + 'px', left: Math.floor((W - w) / 2) + 'px', top: Math.floor((H - h) / 2) + 'px' });
}
addEventListener('resize', fitCam);
let revealT;
function playCurrent() {
  if (!playerReady) return;
  $('camWrap').classList.add('loading');
  player.loadVideoById(city().cams[camIdx]); player.mute(); player.playVideo();
  // Mostramos el reproductor enseguida (si YouTube pone un anuncio antes, se ve en vez de pantalla negra)
  clearTimeout(revealT); revealT = setTimeout(() => $('camWrap').classList.remove('loading'), 1500);
}
function nextCam(auto, dir = 1) {
  const n = city().cams.length;
  if (auto && ++failCount >= n) { toast('Ninguna cámara de ' + city().name + ' está transmitiendo'); return; }
  camIdx = (camIdx + dir + n) % n;
  if (!auto) toast(`Cámara ${camIdx + 1} de ${n}`);
  playCurrent();
}
// Al volver de otra app, retoma la cámara
document.addEventListener('visibilitychange', () => { if (!document.hidden && playerReady) { player.mute(); player.playVideo(); } });

// ---------- Hora y clima ----------
const fmt = tz => new Intl.DateTimeFormat('es', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:tz }).format(new Date());
function tickClocks() {
  $('clock').textContent = fmt(city().tz);
  document.querySelectorAll('[data-tz]').forEach(el => el.textContent = fmt(el.dataset.tz));
}
setInterval(tickClocks, 15000);
const WMO = { 0:['Despejado','☀️','🌙'], 1:['Despejado','🌤','🌙'], 2:['Algo nublado','⛅','☁️'], 3:['Nublado','☁️','☁️'], 45:['Neblina','🌫','🌫'], 48:['Neblina','🌫','🌫'],
  51:['Llovizna','🌦','🌧'], 53:['Llovizna','🌦','🌧'], 55:['Llovizna','🌧','🌧'], 61:['Lluvia','🌧','🌧'], 63:['Lluvia','🌧','🌧'], 65:['Lluvia fuerte','🌧','🌧'],
  71:['Nieve','🌨','🌨'], 73:['Nieve','🌨','🌨'], 75:['Nevada','❄️','❄️'], 80:['Chubascos','🌦','🌧'], 81:['Chubascos','🌧','🌧'], 82:['Chubascos','⛈','⛈'], 95:['Tormenta','⛈','⛈'], 96:['Tormenta','⛈','⛈'], 99:['Tormenta','⛈','⛈'] };
let wReq = 0;
async function loadWeather() {
  const c = city(), req = ++wReq;
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code,is_day&timezone=auto`);
    const { current } = await r.json(); if (req !== wReq) return;
    const w = WMO[current.weather_code] || ['','🌡','🌡'], t = current.temperature_2m;
    $('weather').textContent = `${current.is_day ? w[1] : w[2]} ${Math.round(t*9/5+32)}°F · ${Math.round(t)}°C  ${w[0]}`;
  } catch { if (req === wReq) $('weather').innerHTML = '&nbsp;'; }
}
setInterval(loadWeather, 15 * 60 * 1000);

// ---------- Ocultar la interfaz sola para ver la cámara ----------
let idleT;
function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!ov) document.body.classList.add('idle'); }, 12000); }
const isIdle = () => document.body.classList.contains('idle');

let tT;
function toast(m) { $('toast').textContent = m; $('toast').classList.add('show'); clearTimeout(tT); tT = setTimeout(() => $('toast').classList.remove('show'), 2200); }

// ---------- Control remoto ----------
// Teclas que manda la app nativa: back, menu, playpause, ff, rew
window.tvKey = k => {
  if (k === 'back') { if (ov) closeOverlay(); else if (isIdle()) wake(); else { document.body.classList.add('idle'); clearTimeout(idleT); } return; }
  if (k === 'ff')  { nextCam(false, 1); return; }
  if (k === 'rew') { nextCam(false, -1); return; }
  if (k === 'playpause') { isIdle() ? wake() : (document.body.classList.add('idle'), clearTimeout(idleT)); return; }
  if (k === 'menu') { wake(); ov ? closeOverlay() : openOverlay('cities'); }
};

document.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(k)) e.preventDefault();
  if (ov) {
    wake();
    const cols = getComputedStyle(grid()).gridTemplateColumns.split(' ').length;
    if (k === 'ArrowRight') moveOv(1); else if (k === 'ArrowLeft') moveOv(-1);
    else if (k === 'ArrowDown') moveOv(cols); else if (k === 'ArrowUp') moveOv(-cols);
    else if (k === 'Enter') pickOverlay();
    else if (k === 'Escape' || k === 'Backspace') closeOverlay();
    return;
  }
  // ▲▼ cambian de ciudad incluso con la interfaz oculta (como cambiar de canal)
  if (k === 'ArrowUp')   { selectCity(cityIdx - 1, true); return; }
  if (k === 'ArrowDown') { selectCity(cityIdx + 1, true); return; }
  if (isIdle()) { wake(); return; }           // la primera tecla solo muestra la interfaz
  wake();
  if (k === 'ArrowRight') { dockIdx = Math.min(DOCK.length - 1, dockIdx + 1); paintDock(); }
  else if (k === 'ArrowLeft') { dockIdx = Math.max(0, dockIdx - 1); paintDock(); }
  else if (k === 'Enter') activate(DOCK[dockIdx]);
  else if (k === 'c' || k === 'C') nextCam(false, 1);
  else if (k === 'Escape') window.tvKey('back');
});
document.addEventListener('mousemove', wake);

// ---------- Inicio ----------
renderDock();
$('cityName').textContent = city().name; $('citySpot').textContent = '· ' + city().spot;
tickClocks(); loadWeather(); wake();
setTimeout(() => toast('◄ ► apps   ·   ▲ ▼ ciudad   ·   ⏩ cámara'), 1500);
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
</body>
</html>
