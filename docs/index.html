<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>MyTV Live Cams</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="cities.js"></script>
<style>
  :root { --bg:#05070c; --line:rgba(255,255,255,.12); --accent:#38bdf8; color-scheme:dark; }
  * { -webkit-user-select:none; user-select:none; box-sizing:border-box; font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  html, body { height:100%; margin:0; background:var(--bg); color:#fff; overflow:hidden; }
  @media (max-width: 860px) { body:not(.tv) { overflow-y:auto; } }

  /* Fondo: cámara en vivo a pantalla completa */
  #camWrap { position:fixed; inset:0; overflow:hidden; z-index:0; background:#000; }
  #camWrap iframe, #player { position:absolute; top:50%; left:50%; width:100vw; height:56.25vw; min-height:100vh; min-width:177.78vh;
    transform:translate(-50%,-50%) scale(1.15); pointer-events:none; border:0; transition:opacity 1s ease; }
  #camWrap.loading iframe { opacity:0; }
  #loader { position:fixed; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; pointer-events:none; transition:opacity .6s; }
  #camWrap:not(.loading) + #loader { opacity:0; }
  .spinner { width:42px; height:42px; border-radius:50%; border:3px solid rgba(255,255,255,.15); border-top-color:var(--accent); animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .vignette { position:fixed; inset:0; pointer-events:none; z-index:2; transition:opacity .5s;
    background: radial-gradient(circle at 20% 50%, rgba(0,0,0,.05) 0%, rgba(0,0,0,.55) 100%),
                linear-gradient(to right, rgba(0,0,0,.65) 0%, rgba(0,0,0,.05) 45%, rgba(0,0,0,.45) 100%); }

  .glass-panel { background:rgba(18,22,32,.5); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%); border:1px solid var(--line); box-shadow:0 20px 50px rgba(0,0,0,.5); }
  .glass-item { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); transition:all .25s cubic-bezier(.2,.8,.2,1); outline:none; }
  .glass-item.active, .glass-item:hover { background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.5); transform:translateX(12px) scale(1.03); box-shadow:0 10px 30px rgba(0,0,0,.6), 0 0 20px rgba(255,255,255,.22); }
  /* En la TV el blur cuesta mucha GPU: usamos vidrio sólido */
  body.tv .glass-panel, body.tv .glass-item { backdrop-filter:none; -webkit-backdrop-filter:none; }
  body.tv .glass-panel { background:rgba(10,13,22,.72); }
  body.tv .glass-item { background:rgba(10,13,22,.55); }
  body.tv .glass-item.active { background:rgba(255,255,255,.24); }

  .action-item { transition:all .2s ease; color:rgba(255,255,255,.7); }
  .action-item:hover { color:#fff; text-shadow:0 0 12px rgba(255,255,255,.8); }
  .city-btn { border:1px solid transparent; transition:background .2s, border-color .2s; }
  .city-btn:hover { background:rgba(255,255,255,.1); }
  .city-btn.on { background:rgba(56,189,248,.18); border-color:rgba(56,189,248,.6); }
  .cam-chip { border:1px solid rgba(255,255,255,.2); }
  .cam-chip.on { background:#fff; color:#000; border-color:#fff; }
  #cityList { max-height:min(46vh, 420px); overflow-y:auto; }
  ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.25); border-radius:4px; }

  .shell { position:relative; z-index:10; min-height:100%; display:flex; flex-direction:column; justify-content:space-between; gap:24px;
    padding: clamp(20px,4vw,56px) max(16px,4vw); }
  .shell > * { transition:opacity .5s; }
  body.cinema .shell > *:not(#topbar), body.cinema .vignette { opacity:0; pointer-events:none; }
  body.cinema #topbar .hide-cinema { opacity:0; }

  /* Todas las apps (solo TV) */
  #allApps { position:fixed; inset:0; z-index:40; background:rgba(5,7,12,.92); display:none; padding:56px 4vw; overflow:hidden; }
  #allApps.open { display:block; }
  #allAppsGrid { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:18px; max-height:calc(100vh - 160px); overflow-y:auto; padding:8px; }
  .app-tile { aspect-ratio:16/9; border-radius:14px; background:rgba(255,255,255,.07); border:2px solid transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:10px; transition:transform .15s, border-color .15s; }
  .app-tile img { max-height:62%; max-width:90%; object-fit:contain; }
  .app-tile span { font-size:13px; color:rgba(255,255,255,.8); text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .app-tile.active { border-color:#fff; transform:scale(1.08); background:rgba(255,255,255,.15); }
  kbd { font-family:inherit; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<div id="camWrap" class="loading"><div id="player"></div></div>
<div id="loader"><div class="spinner"></div></div>
<div class="vignette"></div>

<div class="shell">
  <div id="topbar" class="flex flex-wrap justify-between items-start gap-4">
    <div class="flex flex-col gap-2">
      <div class="flex items-center gap-3 bg-black/45 px-4 py-2 rounded-full border border-white/10 w-fit">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
        <span class="text-xs uppercase tracking-widest font-semibold text-gray-200" id="liveLabel">EN VIVO</span>
      </div>
      <div class="hide-cinema text-xs text-white/60 pl-2 transition-opacity" id="camTitle"></div>
    </div>
    <div class="flex items-center gap-6">
      <div class="text-right">
        <div class="text-lg font-semibold tabular-nums" id="weatherTemp">--°</div>
        <div class="text-xs text-gray-300 tracking-wider" id="weatherCond">Cargando clima…</div>
      </div>
      <span id="weatherIcon" class="text-3xl" aria-hidden="true">·</span>
      <div class="text-right">
        <div class="text-4xl md:text-5xl font-light tracking-tight text-white/90 tabular-nums" id="cityClock">--:--</div>
        <div class="text-[11px] text-white/50 tracking-wider" id="homeClock"></div>
      </div>
    </div>
  </div>

  <div class="flex flex-col md:flex-row md:justify-between md:items-end gap-8 my-auto">
    <div class="w-full max-w-sm md:w-96 flex flex-col gap-3 pr-4" id="appMenuList" role="menu"></div>

    <div class="flex flex-col items-stretch md:items-end gap-5">
      <div class="glass-panel p-4 rounded-2xl flex flex-col gap-3 w-full md:w-72">
        <div class="flex items-center justify-between px-1">
          <span class="text-xs uppercase tracking-widest text-gray-300 font-semibold">Ciudades en vivo</span>
          <span class="text-[10px] text-white/40" id="cityCount"></span>
        </div>
        <div id="cityList" class="flex flex-col gap-1 pr-1"></div>
        <div class="pt-2 border-t border-white/10 flex flex-col gap-2">
          <span class="text-[10px] uppercase tracking-wider text-gray-400 px-1">Cámara</span>
          <div id="camChips" class="flex flex-wrap gap-1.5"></div>
          <button id="addCamBtn" class="no-tv text-left text-[11px] text-sky-300 hover:text-sky-200 px-1">+ Agregar cámara de YouTube</button>
          <form id="addCamForm" class="hidden flex-col gap-1.5">
            <input id="addCamUrl" type="text" placeholder="Pega el link del en vivo" class="bg-black/60 text-xs text-white p-2 rounded-lg border border-white/20 focus:outline-none focus:border-sky-400">
            <div class="flex gap-2">
              <button type="submit" class="text-xs bg-sky-500 hover:bg-sky-400 text-black font-semibold px-3 py-1.5 rounded-lg">Guardar</button>
              <button type="button" id="addCamCancel" class="text-xs text-white/60 px-2">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-6 text-sm font-medium tracking-wide pr-2">
        <button class="action-item" id="cinemaBtn">⛶ Modo cine</button>
        <button class="action-item" id="allAppsBtn">▦ All apps</button>
        <button class="action-item" id="settingsBtn">⚙ Settings</button>
      </div>
    </div>
  </div>

  <div class="flex flex-wrap justify-between items-center gap-3 text-xs text-white/45 pt-4 border-t border-white/10">
    <div class="flex flex-wrap items-center gap-4" id="hints"></div>
    <div>MyTV • Live Cams Edition</div>
  </div>
</div>

<div id="allApps">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-semibold">Todas las apps</h2>
    <span class="text-xs text-white/50">◄ ▲ ▼ ► mover · OK abrir · Atrás cerrar</span>
  </div>
  <div id="allAppsGrid"></div>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 glass-panel px-6 py-3 rounded-xl font-medium opacity-0 transition-all duration-300 pointer-events-none">
  <span id="toastMessage"></span>
</div>

<script>
// ============ ESTADO ============
const $ = id => document.getElementById(id);
const TV = typeof window.AndroidTV !== 'undefined';           // true dentro de la app de la TV
if (TV) { document.body.classList.add('tv'); document.querySelectorAll('.no-tv').forEach(e => e.hidden = true); }
const CITIES = window.CITIES, APPS = window.APPS;
const store = { get(k,d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const customCams = store.get('customCams', {});
let cityIdx = Math.max(0, CITIES.findIndex(c => c.id === store.get('city','tokyo')));
let camIdx = 0, focus = 0, player = null, playerReady = false, failCount = 0;
const camsOf = c => [...(customCams[c.id] || []), ...c.cams];
const city = () => CITIES[cityIdx];

$('hints').innerHTML = (TV
  ? [['▲/▼','Apps'],['◄/►','Ciudad'],['⏩','Cambiar cámara'],['⏯','Modo cine'],['☰','Todas las apps']]
  : [['▲/▼','Apps'],['◄/►','Ciudad'],['C','Cambiar cámara'],['H','Modo cine']])
  .map(([k,t]) => `<span><kbd class="bg-white/10 px-1.5 py-0.5 rounded text-[10px] mr-1">${k}</kbd> ${t}</span>`).join('');

// ============ APPS ============
function renderApps() {
  const box = $('appMenuList'); box.innerHTML = '';
  APPS.forEach((app, i) => {
    const el = document.createElement('div');
    el.className = 'glass-item px-5 py-3.5 rounded-2xl flex items-center gap-4 cursor-pointer font-medium' + (i === focus ? ' active' : '');
    el.onclick = () => { focus = i; updateFocus(); openApp(app); };
    el.innerHTML = `<div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center font-extrabold text-lg tracking-tighter" style="color:${app.color}">${app.mark}</div>
                    <span class="text-lg md:text-xl tracking-wide">${app.name}</span>`;
    box.appendChild(el);
  });
}
const updateFocus = () => document.querySelectorAll('#appMenuList .glass-item').forEach((el,i) => el.classList.toggle('active', i === focus));
function openApp(app) {
  if (!TV) return toast('Abriendo ' + app.name + '…');
  toast('Abriendo ' + app.name + '…');
  if (!AndroidTV.launch(app.pkgs.join(','))) toast(app.name + ' no está instalada en esta TV');
}

// ============ CIUDADES Y CÁMARAS ============
function renderCities() {
  const box = $('cityList'); box.innerHTML = '';
  $('cityCount').textContent = CITIES.length + ' ciudades';
  CITIES.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'city-btn text-left px-3 py-2 rounded-xl flex items-center gap-3' + (i === cityIdx ? ' on' : '');
    b.tabIndex = -1;
    b.innerHTML = `<span class="text-lg">${c.flag}</span><span class="flex-1 min-w-0"><span class="block text-sm font-medium">${c.name}</span><span class="block text-[11px] text-white/50 truncate">${c.spot}</span></span><span class="text-[11px] text-white/45 tabular-nums" data-tz="${c.tz}"></span>`;
    b.onclick = () => selectCity(i);
    box.appendChild(b);
  });
  tickClocks();
}
function renderCamChips() {
  const box = $('camChips'); box.innerHTML = '';
  camsOf(city()).forEach((id, i) => {
    const b = document.createElement('button');
    b.className = 'cam-chip text-xs px-3 py-1 rounded-full' + (i === camIdx ? ' on' : '');
    b.tabIndex = -1; b.textContent = 'Cam ' + (i + 1);
    b.onclick = () => { camIdx = i; failCount = 0; playCurrent(); };
    box.appendChild(b);
  });
}
function selectCity(i) {
  cityIdx = (i + CITIES.length) % CITIES.length; camIdx = 0; failCount = 0;
  store.set('city', city().id);
  const btns = document.querySelectorAll('.city-btn');
  btns.forEach((b,j) => b.classList.toggle('on', j === cityIdx));
  const list = $('cityList'), el = btns[cityIdx];
  if (el) list.scrollTop = el.offsetTop - list.offsetTop - list.clientHeight / 2 + el.clientHeight / 2;
  $('liveLabel').textContent = 'EN VIVO • ' + city().name.toUpperCase() + ' • ' + city().spot.toUpperCase();
  playCurrent(); loadWeather(); tickClocks();
}

// ============ REPRODUCTOR YOUTUBE ============
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: camsOf(city())[camIdx],
    playerVars: { autoplay:1, mute:1, controls:0, disablekb:1, fs:0, iv_load_policy:3, modestbranding:1, playsinline:1, rel:0 },
    events: {
      onReady: e => { playerReady = true; e.target.mute(); e.target.playVideo(); selectCity(cityIdx); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) {
          $('camWrap').classList.remove('loading'); failCount = 0;
          const d = player.getVideoData ? player.getVideoData() : null;
          $('camTitle').textContent = d && d.title ? d.title.slice(0, 90) : '';
        }
        if (e.data === YT.PlayerState.ENDED) nextCam(true);
      },
      onError: () => nextCam(true)
    }
  });
}
function playCurrent() {
  renderCamChips();
  if (!playerReady) return;
  $('camWrap').classList.add('loading'); $('camTitle').textContent = '';
  player.loadVideoById(camsOf(city())[camIdx]); player.mute();
}
function nextCam(auto) {
  const list = camsOf(city());
  if (auto && ++failCount >= list.length) { toast('Ninguna cámara de ' + city().name + ' está transmitiendo ahora'); return; }
  camIdx = (camIdx + 1) % list.length;
  if (auto) toast('Cámara no disponible, probando otra…');
  playCurrent();
}
// Si la TV vuelve del fondo (otra app), retoma la cámara
document.addEventListener('visibilitychange', () => { if (!document.hidden && playerReady) { player.mute(); player.playVideo(); } });

// ============ RELOJES ============
const fmt = tz => new Intl.DateTimeFormat('es', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:tz }).format(new Date());
function tickClocks() {
  $('cityClock').textContent = fmt(city().tz);
  $('homeClock').textContent = 'Tu hora ' + fmt(Intl.DateTimeFormat().resolvedOptions().timeZone);
  document.querySelectorAll('[data-tz]').forEach(el => el.textContent = fmt(el.dataset.tz));
}
setInterval(tickClocks, 15000);

// ============ CLIMA REAL (Open-Meteo, gratis, sin API key) ============
const WMO = { 0:['Despejado','☀️','🌙'], 1:['Mayormente despejado','🌤','🌙'], 2:['Parcialmente nublado','⛅','☁️'], 3:['Nublado','☁️','☁️'],
  45:['Neblina','🌫','🌫'], 48:['Neblina','🌫','🌫'], 51:['Llovizna','🌦','🌧'], 53:['Llovizna','🌦','🌧'], 55:['Llovizna','🌧','🌧'],
  61:['Lluvia ligera','🌧','🌧'], 63:['Lluvia','🌧','🌧'], 65:['Lluvia fuerte','🌧','🌧'], 71:['Nieve ligera','🌨','🌨'], 73:['Nieve','🌨','🌨'], 75:['Nevada fuerte','❄️','❄️'],
  80:['Chubascos','🌦','🌧'], 81:['Chubascos','🌧','🌧'], 82:['Chubascos fuertes','⛈','⛈'], 95:['Tormenta','⛈','⛈'], 96:['Tormenta','⛈','⛈'], 99:['Tormenta','⛈','⛈'] };
let weatherReq = 0;
async function loadWeather() {
  const c = city(), req = ++weatherReq;
  $('weatherCond').textContent = 'Cargando clima…';
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code,is_day&timezone=auto`);
    const { current } = await r.json(); if (req !== weatherReq) return;
    const w = WMO[current.weather_code] || ['—','🌡','🌡'], cdeg = current.temperature_2m;
    $('weatherTemp').textContent = `${Math.round(cdeg * 9/5 + 32)}°F · ${Math.round(cdeg)}°C`;
    $('weatherCond').textContent = `${w[0]} • ${c.name}`;
    $('weatherIcon').textContent = current.is_day ? w[1] : w[2];
  } catch { if (req === weatherReq) { $('weatherCond').textContent = c.name; $('weatherTemp').textContent = '--°'; } }
}
setInterval(loadWeather, 15 * 60 * 1000);

// ============ AGREGAR CÁMARA PROPIA (navegador) ============
const ytId = s => (s.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/) || s.match(/^([\w-]{11})$/) || [])[1] || null;
$('addCamBtn').onclick = () => { $('addCamForm').classList.replace('hidden','flex'); $('addCamUrl').focus(); };
$('addCamCancel').onclick = () => $('addCamForm').classList.replace('flex','hidden');
$('addCamForm').onsubmit = e => {
  e.preventDefault();
  const id = ytId($('addCamUrl').value.trim());
  if (!id) return toast('Ese link no parece de YouTube');
  (customCams[city().id] ||= []).unshift(id); store.set('customCams', customCams);
  $('addCamUrl').value = ''; $('addCamForm').classList.replace('flex','hidden');
  camIdx = 0; failCount = 0; playCurrent(); toast('Cámara guardada en ' + city().name);
};

// ============ TODAS LAS APPS (TV) ============
let allApps = [], appFocus = 0;
function openAllApps() {
  if (!TV) return toast('Disponible en la TV');
  try { allApps = JSON.parse(AndroidTV.getApps()); } catch { allApps = []; }
  const g = $('allAppsGrid');
  g.innerHTML = allApps.map((a,i) => `<div class="app-tile${i===0?' active':''}">${a.icon ? `<img src="${a.icon}" alt="">` : ''}<span>${a.label}</span></div>`).join('');
  [...g.children].forEach((el,i) => el.onclick = () => AndroidTV.launch(allApps[i].pkg));
  appFocus = 0; $('allApps').classList.add('open');
}
const closeAllApps = () => $('allApps').classList.remove('open');
function moveAppFocus(d) {
  const tiles = $('allAppsGrid').children; if (!tiles.length) return;
  appFocus = Math.min(tiles.length - 1, Math.max(0, appFocus + d));
  [...tiles].forEach((t,i) => t.classList.toggle('active', i === appFocus));
  tiles[appFocus].scrollIntoView({ block:'nearest' });
}

// ============ ACCIONES ============
let toastT;
function toast(msg) {
  const t = $('toast'); $('toastMessage').textContent = msg;
  t.classList.replace('opacity-0','opacity-100'); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.replace('opacity-100','opacity-0'), 2400);
}
const toggleCinema = () => document.body.classList.toggle('cinema');
$('cinemaBtn').onclick = toggleCinema;
$('allAppsBtn').onclick = openAllApps;
$('settingsBtn').onclick = () => TV ? AndroidTV.openSettings() : toast('Ajustes disponibles en la TV');

// Modo cine automático tras 2 min sin tocar el control (solo TV)
let idleT; const resetIdle = () => { clearTimeout(idleT); if (TV) idleT = setTimeout(() => document.body.classList.add('cinema'), 120000); };

// Teclas especiales del control que manda la app nativa
window.tvKey = k => {
  resetIdle();
  if (k === 'back') {
    if ($('allApps').classList.contains('open')) closeAllApps();
    else if (document.body.classList.contains('cinema')) toggleCinema();
    else toggleCinema();                       // Atrás en el inicio = modo cine
  }
  else if (k === 'playpause') toggleCinema();
  else if (k === 'ff') { failCount = 0; nextCam(false); }
  else if (k === 'rew') { failCount = 0; camIdx = (camIdx - 2 + camsOf(city()).length) % camsOf(city()).length; nextCam(false); }
  else if (k === 'menu') $('allApps').classList.contains('open') ? closeAllApps() : openAllApps();
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  resetIdle();
  const k = e.key;
  if ($('allApps').classList.contains('open')) {
    const cols = getComputedStyle($('allAppsGrid')).gridTemplateColumns.split(' ').length;
    if (k === 'ArrowRight') moveAppFocus(1); else if (k === 'ArrowLeft') moveAppFocus(-1);
    else if (k === 'ArrowDown') moveAppFocus(cols); else if (k === 'ArrowUp') moveAppFocus(-cols);
    else if (k === 'Enter') { const a = allApps[appFocus]; if (a) { closeAllApps(); AndroidTV.launch(a.pkg); } }
    else if (k === 'Escape' || k === 'Backspace') closeAllApps();
    e.preventDefault(); return;
  }
  if (document.body.classList.contains('cinema') && !['ArrowLeft','ArrowRight','c','C'].includes(k)) { toggleCinema(); e.preventDefault(); return; }
  if (k === 'ArrowDown') { if (focus < APPS.length - 1) { focus++; updateFocus(); } e.preventDefault(); }
  else if (k === 'ArrowUp') { if (focus > 0) { focus--; updateFocus(); } e.preventDefault(); }
  else if (k === 'ArrowRight') { selectCity(cityIdx + 1); e.preventDefault(); }
  else if (k === 'ArrowLeft') { selectCity(cityIdx - 1); e.preventDefault(); }
  else if (k === 'c' || k === 'C') { failCount = 0; nextCam(false); }
  else if (k === 'h' || k === 'H') toggleCinema();
  else if (k === 'Enter') { openApp(APPS[focus]); e.preventDefault(); }
});

// ============ INICIO ============
renderApps(); renderCities(); renderCamChips(); loadWeather(); resetIdle();
$('liveLabel').textContent = 'EN VIVO • ' + city().name.toUpperCase() + ' • ' + city().spot.toUpperCase();
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
</body>
</html>
